
    
  
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Locate installed MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found on the runner." }
          Split-Path $msbuild | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore and build
        run: msbuild GHubXBOXProfileFixer.csproj /restore /p:Configuration=Release /p:CI=true

      - name: Run database and scanner regression checks
        shell: pwsh
        run: |
          msbuild tests/RegressionTests.csproj /restore /p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tests/bin/Release/net48/RegressionTests.exe --keep
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify UI and capture previews
        shell: pwsh
        run: |
          msbuild tests/UiSmokeTests/UiSmokeTests.csproj /restore /p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tests/UiSmokeTests/bin/Release/net48/UiSmokeTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload UI previews
        uses: actions/upload-artifact@v6
        with:
          name: UI-previews
          path: previews/
          if-no-files-found: error

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item bin\Release\net48\GHubXBOXGamePassProfileFixer.exe release\GHubXBOXGamePassProfileFixer.exe
          $hash = (Get-FileHash release\GHubXBOXGamePassProfileFixer.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  GHubXBOXGamePassProfileFixer.exe" | Set-Content release\GHubXBOXGamePassProfileFixer.exe.sha256 -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: GHubXBOXGamePassProfileFixer-${{ github.sha }}
          path: release/
          if-no-files-found: error

      - name: Attest release executable
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/GHubXBOXGamePassProfileFixer.exe

     
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = "release/GHubXBOXGamePassProfileFixer.exe"
          $checksum = "release/GHubXBOXGamePassProfileFixer.exe.sha256"

          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $checksum --clobber
          }
          else {
            gh release create $tag $exe $checksum --generate-notes --verify-tag
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
